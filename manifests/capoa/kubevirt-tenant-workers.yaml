# Worker pool for the CAPOA+KubeVirt tenant cluster (day-2 scaling).
#
# Rendered with envsubst using the same variables as the tenant cluster
# manifest: CLUSTER_NAME, TENANT_NAMESPACE, OCP_MAJOR_MINOR,
# STORAGE_CLASS and DAY2_WORKERS_COUNT (see hack/caas.yaml).
#
# Apply once the compact control plane is installed (ACI in
# adding-hosts): each machine registers as a new agent and joins the
# existing cluster through the assisted-service.
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha2
kind: OpenshiftAssistedConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: ${TENANT_NAMESPACE}
spec:
  template:
    spec:
      pullSecretRef:
        name: pull-secret
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: ${TENANT_NAMESPACE}
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: none
      virtualMachineTemplate:
        metadata:
          namespace: ${TENANT_NAMESPACE}
        spec:
          dataVolumeTemplates:
          - metadata:
              name: rootdisk
            spec:
              source:
                pvc:
                  name: rhcos-golden-${OCP_MAJOR_MINOR}
                  namespace: ${TENANT_NAMESPACE}
              storage:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 100Gi
                storageClassName: ${STORAGE_CLASS}
                volumeMode: Block
          runStrategy: Always
          template:
            metadata:
              annotations:
                kubevirt.io/allow-pod-bridge-network-live-migration: ""
            spec:
              evictionStrategy: LiveMigrateIfPossible
              domain:
                cpu:
                  cores: 4
                devices:
                  disks:
                  - disk:
                      bus: virtio
                    name: rootdisk
                  interfaces:
                  - bridge: {}
                    name: default
                memory:
                  guest: 8Gi
              networks:
              - name: default
                pod: {}
              volumes:
              - dataVolume:
                  name: rootdisk
                name: rootdisk
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: ${TENANT_NAMESPACE}
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${DAY2_WORKERS_COUNT}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
      cluster.x-k8s.io/deployment-name: ${CLUSTER_NAME}-workers
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
        cluster.x-k8s.io/deployment-name: ${CLUSTER_NAME}-workers
    spec:
      clusterName: ${CLUSTER_NAME}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: OpenshiftAssistedConfigTemplate
          name: ${CLUSTER_NAME}-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: KubevirtMachineTemplate
        name: ${CLUSTER_NAME}-workers
