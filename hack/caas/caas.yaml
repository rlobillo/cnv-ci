# Unified configuration for the CAAS standalone deployment and tenant
# lifecycle scripts.
#
# This file holds the SHARED configuration: versions, external references,
# namespaces, storage classes and manifest paths used by more than one
# script or describing the environment. Each key can be overridden through
# a same-named environment variable. Per-script tunables (e.g. wait
# timeouts of a single test) default inside the scripts themselves, also
# overridable through environment variables.
# This file is also passed to clusterctl (--config): keys that
# clusterctl does not interpret are treated as variable-substitution values,
# which is harmless.
#
# CAPOA is intentionally NOT installed via clusterctl: every CAPOA GitHub
# release publishes a stale metadata.yaml (its releaseSeries only covers the
# old 0.1 series), so "clusterctl init" fails for any newer release with
# "invalid provider metadata: version ... does not match any release series".
# CAPOA is instead installed with oc apply from the git manifests referenced
# by CAPOA_REPO_REF / CAPOA_CONTROLPLANE_MANIFEST / CAPOA_BOOTSTRAP_MANIFEST.

# Cluster API version. Pins both the clusterctl binary downloaded by the
# script and the core provider installed by "clusterctl init".
# Supported specifiers (resolved at deploy time via git ls-remote, see
# resolve_version in deploy-caas-infra-standalone.sh):
#   "v1.11.3"  exact release tag
#   "v1.11"    series track: latest patch release of the v1.11 series
#   "latest"   newest stable release
# Default "latest": this job doubles as early warning for upstream
# incompatibilities. CAPOA master vendors CAPI v1.12.x, so latest (v1.14.x
# today) may run ahead of what CAPOA is built against; pin to CAPOA's
# vendored series (e.g. "v1.12") if stability is preferred over drift
# detection, or to an exact tag to reproduce a failure.
CAPI_VERSION: "latest"

# CAPK (cluster-api-provider-kubevirt) version. Same specifier syntax as
# CAPI_VERSION.
# NOTE: CAPK v0.1.x implements only the CAPI v1beta1 contract, while CAPOA
# labels the CAPK CRDs as v1beta2 (ensureCRDContractLabels in controlplane
# main.go). With a v1beta1-only CAPK the CAPI machine controller waits for
# status.initialization.provisioned forever and machines stay in
# Provisioning. CAPK >= v0.11 implements the v1beta2 contract and keeps the
# v1alpha1 APIs used by the tenant manifests — always use >= v0.11 here.
CAPK_VERSION: "latest"

# cert-manager version.
CERT_MANAGER_VERSION: "v1.16.2"

# assisted-service git tag for CRDs and kustomize manifests.
ASSISTED_SERVICE_TAG: "v2.56.1"

# assisted-service CRD paths, fetched from raw.githubusercontent.com/
# openshift/assisted-service at ASSISTED_SERVICE_TAG. Required CRDs not
# bundled in the infrastructure-operator itself.
ASSISTED_SERVICE_CRD_PATHS: "hack/crds/hive/hive.openshift.io_clusterdeployments.yaml hack/crds/hive/hive.openshift.io_clusterimagesets.yaml hack/crds/mce/managedclusters.cluster.open-cluster-management.io.yaml"

# Kustomize path for the infrastructure-operator (applied with
# ?ref=ASSISTED_SERVICE_TAG).
ASSISTED_SERVICE_KUSTOMIZE_PATH: "config/default"

# CAPOA git ref and install manifest paths (fetched from
# raw.githubusercontent.com/openshift-assisted/cluster-api-provider-openshift-assisted).
CAPOA_REPO_REF: "master"
CAPOA_CONTROLPLANE_MANIFEST: "test/e2e/manifests/capcoa/controlplane_install.yaml"
CAPOA_BOOTSTRAP_MANIFEST: "test/e2e/manifests/capboa/bootstrap_install.yaml"

# CAPOA controller images. Defaults match the upstream manifests (the sed
# replacement is a no-op); override them to test custom builds.
CAPOA_CTRL_IMAGE: "quay.io/edge-infrastructure/cluster-api-controlplane-provider-openshift-assisted:latest"
CAPOA_BOOT_IMAGE: "quay.io/edge-infrastructure/cluster-api-bootstrap-provider-openshift-assisted:latest"

# AgentServiceConfig manifest applied by deploy-caas-infra-standalone.sh and
# create-nested-cluster.sh (relative to the repository root).
AGENTSERVICECONFIG_MANIFEST: "manifests/caas/agentserviceconfig.yaml"

# --- create-nested-cluster.sh ------------------------------------------------
#
# Defaults for the nested cluster creation. The infra cluster is introspected
# at runtime for PULL_SECRET, BASE_DOMAIN and OCP_VERSION.

# Nested cluster resource name and infra project namespace; they may differ.
NESTED_CLUSTER_NAME: "caas-cluster"
TENANT_NAMESPACE: "caas-project"

# Namespace where assisted-service runs on the infra cluster.
ASSISTED_NAMESPACE: "assisted-installer"

# SSH public key injected into tenant cluster nodes (cnv-qe-jenkins).
SSH_AUTHORIZED_KEY: "ssh-rsa "

# Timeouts (minutes) for waiting on the tenant cluster installation. The
# deadline is extended by FINALIZING_TIMEOUT_MIN once the
# AgentClusterInstall reaches "finalizing" (operators deploying).
INSTALL_TIMEOUT_MIN: "90"
FINALIZING_TIMEOUT_MIN: "30"

# Nested cluster manifest, rendered with envsubst (relative to the repository
# root).
NESTED_CLUSTER_MANIFEST: "manifests/caas/nested-cluster.yaml"
# Day-2 worker manifest, rendered with envsubst (relative to the repository root).
WORKERS_MANIFEST: "manifests/caas/nested-cluster-workers.yaml"

# StorageClass on the infra cluster used for the nested cluster VM root disks
# (KubevirtMachineTemplate volume templates), by the KubeVirt CSI driver for
# nested-cluster PVCs, and by the RHCOS golden PVC (csiDriver.infraStorageClass
# in the OACP). Must be RBD-based and support ReadWriteMany + Block volume mode
# so KubeVirt can live-migrate the VMIs. Default: the ODF storageclass created
# alongside OpenShift Virtualization.
CSI_STORAGE_CLASS: "ocs-storagecluster-ceph-rbd-virtualization"

# VolumeSnapshotClass on the infra cluster marked as default so class-less
# tenant VolumeSnapshots resolve against it: the KubeVirt CSI driver creates
# them without a class in the infra namespace whenever the tenant class
# carries no infraSnapshotClassName (e.g. upstream test-driver.yaml
# 'SnapshotClass: FromName'). Default-class selection is driver-aware, so
# this coexists with the platform defaults (e.g. csi-azuredisk-vsc on Azure).
CSI_SNAPSHOT_CLASS: "ocs-storagecluster-rbdplugin-snapclass"

# Persistent storage for the nested cluster's internal image registry. This
# StorageClass is provided by the KubeVirt CSI driver inside the tenant cluster.
IMAGE_REGISTRY_STORAGE_CLASS: "kubevirt-csi"
IMAGE_REGISTRY_STORAGE_SIZE: "20Gi"
IMAGE_REGISTRY_PVC_NAME: "image-registry-storage"

# Day-2 worker pool. The helper waits until this many worker Nodes are Ready
# in the tenant before making the control-plane nodes unschedulable.
DAY2_WORKERS_COUNT: "2"
DAY2_WORKERS_READY_TIMEOUT_MIN: "90"

# --- project-admin mode ------------------------------------------------------
#
# create-nested-cluster.sh provisions the nested cluster as this user: it is created
# (htpasswd IDP), granted the built-in 'admin' role in the tenant namespace,
# and a kubeconfig is generated for it and used for every subsequent step —
# including the infra-cluster-credentials secret, which then carries the
# project-admin kubeconfig (the topology promised by the epic's first user
# story). The CAPI/CAPOA resources must already be aggregated into 'admin'
# by the deployment: standalone does it in deploy-caas-infra-standalone.sh
# (manager-role aggregation workaround); MCE is expected to ship proper
# aggregate roles (product gap, pending upstream).
# Set to "" to keep the legacy cluster-admin flow. Requires only 'openssl':
# 'htpasswd' is not available in the Prow image, so the password hash is
# generated with 'openssl passwd -apr1' ($apr1$, accepted by the HTPasswd
# IDP).
TENANT_ADMIN_USER: "tenant-admin"

# Password for the project-admin user. Auto-generated (random) when empty;
# written to ${ARTIFACT_DIR}/tenant-admin-credentials.txt.
TENANT_ADMIN_PASSWORD: ""
